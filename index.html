<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Questions</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(32, 32, 32);
        color: #fff;
        width: 100%;
        height: 100vh;
      }

      h1 {
        margin: 30px;
        padding: 10px;
        text-align: center;
        font-size: 50px;
      }

      #question-box {
        padding: 40px;
        display: flex;
        flex-direction: column;
        row-gap: 30px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: center;
        justify-content: space-evenly;
        column-gap: 30px;
        row-gap: 20px;
      }

      .box {
        border: 1px solid white;
        padding: 20px 40px;
        font-size: 30px;
        cursor: pointer;
        border-radius: 5px;
        text-align: center;
        text-decoration: none;
        color: #fff;
      }

      .box:hover {
        background-color: #5a5959;
      }

      @media screen and (max-width: 832px) {
        .container {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media screen and (max-width: 569px) {
        .container {
          grid-template-columns: 1fr;
        }

        #question-box {
          padding: 10px 40px;
        }
      }

      @media screen and (max-width: 375px) {
        h1 {
          font-size: 30px;
          margin: 0px;
          margin-top: 30px;
          margin-bottom: 10px;
        }

        #question-box {
          padding: 10px 40px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Java Practice Questions</h1>
    <div id="question-box">
      <div class="container">
        <a href="" class="box">Question 1</a>
        <a href="" class="box">Question 2</a>
        <a href="" class="box">Question 3</a>
        <a href="" class="box">Question 4</a>
        <a href="" class="box">Question 5</a>
        <a href="" class="box">Question 10</a>
      </div>
    </div>
  </body>
</html>
